# Phase 2 training config tuned for YOUR rig: RTX 4060 Laptop Max-Q (Ada Lovelace
# SM 8.9, 8 GB GDDR6, 23 GB host RAM). Select batch size based on the available
# memory headroom on the actual run; measured throughput is hardware/run specific.
# Locked baseline unchanged (Phase 1, Section 3.4): conditioning order [E, relative_density, nu],
# 32³, DDPM T=1000, DDIM 50-100. Only GPU-throughput knobs differ (Phase 2, Section 4.5).
# Run:  MAMBA_ROOT_PREFIX=$PWD/.mamba micromamba run -n metamaterials \
#           python -m src.train --train-config configs/train_4060.yaml \
#                              --model-config configs/model_baseline.yaml
seed: 0
optimizer:
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  eps: 1.0e-8
  lr_schedule: cosine
ema:
  enabled: true
  decay: 0.9999
data:
  hdf5: data/dataset_train.h5
  min_samples: 1600                              # require a production-size training split
  conditioning_order: [E, relative_density, nu]   # matches HDF5 /conditioning_vector (Phase 1, Section 3.4)
  augmentation: true                              # 24 proper cube rotations, no mirrors (Phase 1, Section 3.4)
batch_size: 16                                   # conservative starting point for an 8 GB GPU; increase only after a memory check
mixed_precision: bf16                             # Ada-native bf16 tensor cores; no loss scaling (Phase 2, Section 4.5)
epochs: 500                                       # same number of dataset passes as the baseline config
checkpoint_every: 500
physics_loss:
  option: B                                       # differentiable connectivity proxy (Phase 2, Section 4.4); A is a contingency
  lambda_1: 0.05                                  # Option-B baseline; run lambda_1=0 with --physics-ablation
  iterations: 60                                  # power-iteration budget inside the autograd graph (perf/VRAM trade-off)
  warmup_fraction: 0.2                           # λ₁ warmed from 0 over first 20% of training
  ablation: {lambda_1: 0.0, tag: abl_physics}     # run with --physics-ablation
perf:                                             # Ada tensor-core + dataloader knobs (src/train.py:127-152)
  cudnn_benchmark: true                           # fixed 32³ shapes amortize the cuDNN autotune
  tf32: true                                      # TF32 tensor cores (SM 8.9)
  float32_matmul_precision: high                  # -> torch.set_float32_matmul_precision("high") = TF32 matmul
  num_workers: 8                                  # 23 GB host RAM keeps 8 workers fed; GPU is CPU-bound otherwise (small 3D models)
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
logging:
  backend: tensorboard                            # view via: python -m tensorboard --logdir runs
  project: metamaterials-4060laptop
  sample_interval: 5000

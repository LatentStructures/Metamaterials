# Phase 2 baseline model config (ROADMAP.md Phase 2, Sections 4.2 and 4.3).
unet3d:
  in_channels: 1
  channels: [32, 64, 128, 256]                   # 4 down/up stages (Phase 2, Section 4.2)
  out_channels: 1
  time_embed_dim: 256
  conditioning_dim: 3                            # [E_norm, ρ_norm, ν_norm] — fixed order (Phase 2, Section 4.1)
  conditioning_embed_dim: 256
  attention_resolutions: [4]                     # bottleneck self-attention at 4³; no cross-attention (Phase 2, Section 4.2)
diffusion:
  T: 1000                                       # DDPM training timesteps (Phase 2, Section 4.3)
  beta_schedule: linear
  training_loss: eps_mse                         # standard ε-MSE (L_simple)
sampling:
  schedule: ddim
  steps: [50, 100]                               # DDIM inference steps (Phase 2, Section 4.3)
  target_time_per_sample_s: 60

# Phase 2 baseline model config (ROADMAP.md Phase 2, Sections 4.2 and 4.3).
unet3d:
  in_channels: 1
  channels: [32, 64, 128, 256]                   # 4 down/up stages (Phase 2, Section 4.2)
  out_channels: 1
  time_embed_dim: 256
  conditioning_dim: 3                            # [E_norm, ρ_norm, ν_norm] — fixed order (Phase 2, Section 4.1)
  conditioning_embed_dim: 256
  attention_heads: 4                             # bottleneck self-attention head count
  attention_resolutions: [4]                     # bottleneck self-attention at 4³; no cross-attention (Phase 2, Section 4.2)
diffusion:
  T: 1000                                        # DDPM training timesteps (Phase 2, Section 4.3)
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
sampling:
  schedule: ddim
  steps: 50                                      # DDIM inference steps; locked 50-100 (Phase 2, Section 4.3)
  eta: 0.0                                       # deterministic DDIM
  clamp: [0.0, 1.0]                              # binary occupancy x0 range; omit for legacy [-1, 1]
  batch_size: 32                                 # cap target-chunk GPU memory during inference
  seed: 0                                        # fixed sampling seed; per-target offsets are deterministic
  eval_seed: 0                                   # fixed seed for eval-time DDIM renders inside training
